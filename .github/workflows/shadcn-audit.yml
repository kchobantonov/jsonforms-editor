name: Audit editor shadcn component sources
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jsonforms-editor
    steps:
      - uses: actions/checkout@v4
        with:
          path: jsonforms-editor
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jsonforms-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Compare with the official registry
        run: pnpm shadcn:check --stage "$RUNNER_TEMP/editor-shadcn-review"
      - name: Retain component comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-shadcn-review
          path: ${{ runner.temp }}/editor-shadcn-review
          if-no-files-found: warn
